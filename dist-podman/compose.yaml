name: gemini-bot

services:
  mongo:
    image: docker.io/library/mongo:latest
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - gemini_net

  gateway:
    build: ./twitch-gateway
    restart: always
    ports:
      - "8080:8080" # WS
      - "3000:3000" # HTTP Admin
    volumes:
      # Mount external config read-only
      - ${HOST_CONFIG_PATH:-./.env.example}:/app/config.json:ro
    environment:
      - PORT=3000
      - WS_PORT=8080
      - MONGO_URI=mongodb://mongo:27017/twitch-gateway
    depends_on:
      - mongo
    networks:
      - gemini_net

  app:
    build: .
    restart: always
    ports:
      - "3001:3001"
    volumes:
      # Mount external config read-only
      - ${HOST_CONFIG_PATH:-./.env.example}:/app/config.json:ro
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/gemini-bot
      - GATEWAY_URL=${GATEWAY_URL:-ws://gateway:8080}
    depends_on:
      - mongo
      - gateway
    networks:
      - gemini_net

volumes:
  mongo_data:

networks:
  gemini_net: